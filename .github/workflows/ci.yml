name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (TypeScript, Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  pipeline:
    name: Geospatial Pipeline (uv, Ruff, Import Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: Install pipeline dependencies
        run: uv sync --directory pipeline --frozen

      - name: Ruff lint
        run: uv run --directory pipeline ruff check .

      - name: Ruff format check
        run: uv run --directory pipeline ruff format --check .

      - name: Import smoke test
        run: uv run --directory pipeline python -c "import geopandas, rasterio, shapely, pyproj, requests, levelto_pipeline; print('PIPELINE_OK')"
